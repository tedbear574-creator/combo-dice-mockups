const COLORS = { red: "#ef4b52", blue: "#3f7cf0", green: "#2fb36b", yellow: "#f5bf1d", purple: "#9b5de5" };

const TIERS = [
  { id: "common",   name: "Common",    col: "#c3ccda", mult: 1,   sides: 6,  metal: 0,   rough: .55, ei: 0,   w: 1000 },
  { id: "uncommon", name: "Uncommon",  col: "#5bd977", mult: 1.6, sides: 6,  metal: .12, rough: .45, ei: .18, w: 300 },

  { id: "epic",     name: "Epic",      col: "#b06bff", mult: 4.2, sides: 10, metal: .45, rough: .28, ei: .55, w: 26 },
  { id: "legend",   name: "Legendary", col: "#ffcf3f", mult: 7,   sides: 12, metal: .85, rough: .2,  ei: .8,  w: 6 },

// The timer keeps rolling on its own for idle play; tapping ROLL (or the board) adds steps on top: each tap is one
// step (one share of the strip, or one die), queued and worked off at up to DIE_RATE a second. Faster-rolls

  tapFrame(); return true;

}

  const cell = mine.emptyCell();
  if (cell === undefined) { SFX.no(); announce("Board full — unlock a cell"); return; }
  const d = S.storage.splice(i, 1)[0]; mine.addDie(cell, d, true); SFX.buy(); updateMenuCounts();
}
function updateMenuCounts() {
  const have = Object.keys(S.collection).length;
  C("bookN").textContent = `${have}/${TIERS.length * CNAMES.length}`;
  C("bagN").textContent = `${S.storage.length}`;
  C("sortN").textContent = S.passes.arrange ? "" : "R$";
}

// ================================================================ server banner + fake live pulls
let nextFake = 45000; // first fake pull ~45s in (game time)
function banner(html) { const el = C("banner"); el.classList.remove("show"); void el.offsetWidth; el.innerHTML = html; el.classList.add("show"); }
const FAKE_NAMES = ["Zylo", "mango_77", "BigRoller", "kiki", "DevonX", "pixelcat", "Sven", "QueenB", "noobmaster", "Taz"];
function fakePull() {
  const name = FAKE_NAMES[rnd(FAKE_NAMES.length)];
  if (Math.random() < .45) { const t = 5, c = CNAMES[rnd(5)]; banner(`<span class="sp">★ SHINY</span> <b>${name}</b> pulled a <b>${kindName(t, c)}</b>!`); }
  else { const t = 4, c = CNAMES[rnd(5)]; banner(`<b>${name}</b> pulled a <b>${kindName(t, c)}</b>`); }
}

// ================================================================ menu wiring + init
C("menu").addEventListener("click", e => { const k = e.target.closest("[data-menu]"); if (!k) return;
  ({ shop: openShop, book: openCollection, bag: openBag, sort: () => S.passes.arrange ? arrangeBoard() : openShop() })[k.dataset.menu](); });
document.querySelectorAll(".overlay").forEach(ov => ov.addEventListener("click", e => { if (e.target === ov || e.target.hasAttribute("data-close")) ov.classList.remove("open"); }));
C("barCrate").addEventListener("click", () => openCrate(false));

// Starting deck: three plain Common dice on the three starting cells — the whole board to begin with.
for (let k = 0; k < 3; k++) obtainDie({ tier: 0, color: CNAMES[k], level: 0, shiny: false });
applyStats(); updateMenuCounts();

window.T = { mine, theirs, S, player, enterBoard, leaveBoard, buy,
  // dice / rarity
  TIERS, kindId, kindName, obtainDie,
  // crates
  openCrate, crateCost, crateAvailable, pickTier, setCrateForce: f => { crateForce = f; },
  // storage / collection / shop
  renderStorage, openCollection, openShop, openBag, buyShopItem, SHOP, collectionMult, luck, sellValue, mergeSpecs,
  // active play + goals
  manualRoll, ROLL, FILL, planArrangement, arrangeBoard, get rollBank() { return rollBank; }, get ledgerTot() { return ledgerTot; }, GOALS, get goalIdx() { return S.goalIdx; },
  // powers
  POWERS, buffs, pstate, usePower, addBuff, stats, mikey,
  // prestige
  doPrestige, prestigeStatus, get N() { return N; }, addRun: v => earn(v) }; // test hook
</script>
