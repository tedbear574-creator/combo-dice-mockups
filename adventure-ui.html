<!doctype html>
<!--
PROTOTYPE, throwaway. A playable slice of an Adventure run: the hand screen
(roll, keep or mark dice, drag to reorder, reroll, play, scoring playback with
a score sheet), the cash-out tally, the shop (3 packs, shop reroll, your dice
rack with rolled + reserve slots), and pack opening (pick 1 of 3; tools and
stamps then ask for a die and face). Landscape phone canvas, 844x390.
Round 1 layouts (A Table, B Score sheet, C Equation) are in this branch's
history (commit ba8920b); Tod picked A as the base with B's sheet folded in.
Rules mirror src/shared (Scoring, Dice, Content, Adventure), renamed for players:
points (was chips) = number hand + every face's number + point bonuses;
bonus (was mult) = color hand + bonus adds, then every x bonus.
Boss rules, Diamond and hand-picking 5 of your dice are not in yet.
Sounds are synthesized with Web Audio; no asset files.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Combo Dice - Adventure (prototype)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07060d; overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #f6f3ff;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; left: 0; right: 0; top: 0; bottom: 46px; display: flex;
    align-items: center; justify-content: center; }
  #stage { width: 844px; height: 390px; position: relative; flex: none; overflow: hidden;
    border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.6); transform-origin: center;
    --pts: #4f9bff; --bon: #ff4d63; --pts-ink: #1d5fd0; --bon-ink: #d1233a; }
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 80; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  .screen { position: absolute; inset: 0; display: none; gap: 12px; padding: 12px;
    background: radial-gradient(ellipse at 55% 45%, #2a7a5a 0%, #165038 55%, #0b2a1e 100%); }
  .screen.on { display: flex; }
  #shop { background: repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 2px, transparent 2px 84px), linear-gradient(180deg, #4a2f1a 0%, #2c1b0e 70%, #1e1209 100%); }

  /* ---------- side column ---------- */

  .roundCard.shopCard { background: #d99a52; color: #2b1606; }
  .roundCard .rname { font-size: 18px; font-weight: 900; } .roundCard .ante { font-size: 12px; font-weight: 800; opacity: .75; }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
  .goal .big { font-size: 26px; font-weight: 900; }
  .goal.round .big { color: #ffd23f; }
  .stats { display: flex; justify-content: space-between; }
  .reserve { display: flex; gap: 5px; min-height: 30px; margin-top: 2px; }
  .sideFoot { margin-top: auto; display: flex; gap: 6px; }
  .money { flex: 1; font-size: 28px; font-weight: 900; color: #ffd23f; text-align: center;
    background: rgba(0,0,0,.25); border-radius: 12px; padding: 4px; }
  .gear { width: 44px; border-radius: 12px; background: rgba(0,0,0,.25); font-size: 22px; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }

  /* ---------- relics ---------- */
  .relics { display: flex; gap: 8px; height: 56px; flex: none; }
  .relic { position: relative; cursor: pointer; width: 54px; height: 54px; border-radius: 12px; background: rgba(255,255,255,.12);
    display: grid; place-items: center; border: 2px solid rgba(255,255,255,.18); flex: none; }
  .relic.empty { border-style: dashed; background: transparent; cursor: default; }
  .relic .icon { font-size: 25px; line-height: 1; }
  .relic .name { position: absolute; bottom: -3px; font-size: 9px; font-weight: 800; white-space: nowrap; opacity: .8; }
  .relic.trigger { animation: wiggle .35s ease; }
  .relic.arrive { animation: arrive .5s cubic-bezier(.2,1.6,.4,1); }
  .relic .tip { display: none; position: absolute; z-index: 40; top: 100%; left: 50%; transform: translateX(-50%);

    font-size: 13px; font-weight: 700; text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,.5); }
  .relic.show .tip { display: block; }
  @keyframes wiggle { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-12deg) scale(1.2); }
    60% { transform: rotate(10deg) scale(1.2); } }
  @keyframes arrive { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }

  /* ---------- dice and face tiles (one look at every size; --s sets the size) ---------- */
  .ft { --s: 40px; position: relative; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .22); display: grid; flex: none;
    place-items: center; font-size: calc(var(--s) * .52); font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3);
    box-shadow: inset 0 calc(var(--s) * -.09) 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.25), 0 4px 10px rgba(0,0,0,.4); }
  .ft.c-red    { background: linear-gradient(160deg, #ff6a6f, #d1343b); }
  .ft.c-blue   { background: linear-gradient(160deg, #5f97ff, #2a5fe0); }
  .ft.c-green  { background: linear-gradient(160deg, #47d18a, #1f9555); }
  .ft.c-yellow { background: linear-gradient(160deg, #ffd34d, #e0a000); color: #3b2a00; text-shadow: 0 2px 0 rgba(255,255,255,.35); }
  .ft.c-purple { background: linear-gradient(160deg, #b784ff, #7b3fd6); }
  .ft .pipgrid { width: calc(var(--s) * .72); height: calc(var(--s) * .72); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); place-items: center; }
  .ft .pipgrid i { width: calc(var(--s) * .17); height: calc(var(--s) * .17); border-radius: 50%; background: #fff;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.3); visibility: hidden; }
  .ft .pipgrid i.on { visibility: visible; }
  .ft.c-yellow .pipgrid i { background: #3b2a00; }
  .ft .size { position: absolute; bottom: calc(var(--s) * .05); right: calc(var(--s) * .09); font-size: max(8px, calc(var(--s) * .14));
    font-weight: 800; opacity: .8; text-shadow: none; letter-spacing: .04em; }
  .ft .stamp { position: absolute; top: calc(var(--s) * .05); right: calc(var(--s) * .05); font-size: max(8px, calc(var(--s) * .14)); font-weight: 900;
    z-index: 2; background: #fff; color: #1d5fd0; border-radius: 5px; padding: 0 3px; text-shadow: none; line-height: 1.35; }
  .ft .stamp.sb { color: #d1233a; } .ft .stamp.sc { color: #9a6a00; }
  .ft .mat { position: absolute; top: -9px; left: -6px; font-size: 9px; font-weight: 900; z-index: 2;
    padding: 2px 5px; border-radius: 8px; background: #fff; color: #3a2a6a; text-shadow: none;
    letter-spacing: .05em; box-shadow: 0 2px 6px rgba(0,0,0,.4); white-space: nowrap; }
  .ft.m-glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(125deg, rgba(255,255,255,.55) 0 18%, transparent 30% 60%, rgba(255,255,255,.25) 70%, transparent 80%);
    border: 2px solid rgba(255,255,255,.75); }
  .ft.m-steel { box-shadow: 0 0 0 3px #b8c2cc, inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.4); }
  .ft.m-gold { box-shadow: 0 0 0 3px #ffd23f, inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.4); }
  .ft.m-gold .mat { background: #ffd23f; color: #3b2a00; } .ft.m-steel .mat { background: #b8c2cc; color: #1f2a33; }

  .ft .sig { position: absolute; left: 10%; right: 10%; bottom: calc(var(--s) * -.15 - 3px); height: max(4px, calc(var(--s) * .07));
    display: flex; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(0,0,0,.4); }
  .ft .sig span { height: 100%; }
  .s-red { background: #ff5a60; } .s-blue { background: #4f86ff; } .s-green { background: #34c27a; } .s-yellow { background: #ffc928; } .s-purple { background: #a970ff; }
  .chart { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .crow { display: flex; gap: 2px; align-items: center; }
  .chart .cs { min-width: 17px; height: 15px; border-radius: 4px; font-size: 10px; font-weight: 900; color: #fff; display: grid; place-items: center;
    padding: 0 3px; margin-right: 3px; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .chart .cn { min-width: 15px; height: 15px; border-radius: 4px; background: #ece6f6; color: #221a3a; font-size: 10px; font-weight: 900;
    display: grid; place-items: center; padding: 0 2px; }
  .chart .cn.st { box-shadow: inset 0 0 0 2px #e0a000; background: #fff6d6; }
  .chart.md { gap: 3px; } .chart.md .crow { gap: 3px; }
  .chart.md .cs, .chart.md .cn { height: 20px; min-width: 20px; font-size: 12px; border-radius: 5px; }
  .dice { display: flex; gap: 8px; margin-top: 16px; height: 106px; flex: none; position: relative; }
  .die { --s: 72px; touch-action: none; cursor: grab; transition: transform .16s ease, box-shadow .16s ease, opacity .16s; }
  .die.held { transform: translateY(-12px); box-shadow: 0 0 0 3px #fff, 0 14px 20px rgba(0,0,0,.5); }
  .die.held::after, .die.toss::after { position: absolute; bottom: -31px; left: -10px; right: -10px; text-align: center;
    font-size: 11px; font-weight: 900; letter-spacing: .14em; color: #fff; text-shadow: none; }
  .die.held::after { content: "KEEP"; }
  .die.toss { transform: translateY(8px); opacity: .55; box-shadow: 0 0 0 3px #f0a020, 0 4px 8px rgba(0,0,0,.4); }
  .die.toss::after { content: "REROLL"; color: #ffc25a; bottom: -29px; }
  .die.inhand:not(.held):not(.toss) { box-shadow: 0 0 0 3px rgba(255,255,255,.35), inset 0 -7px 0 rgba(0,0,0,.25), 0 8px 16px rgba(0,0,0,.45); }
  .dragging { transition: none !important; z-index: 20; cursor: grabbing; }
  .die.rolling { animation: tumble .5s ease-out infinite; }
  .land { animation: land .28s ease-out; }
  .die.scoring { animation: scorejig .3s ease-out; transform: translateY(-10px) scale(1.08);
    box-shadow: 0 0 0 4px #fff, 0 0 22px rgba(255,255,255,.55); z-index: 5; }
  .crack { animation: crack .5s ease-in forwards; }
  @keyframes tumble { 0% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-30px) rotate(150deg); }
    70% { transform: translateY(-6px) rotate(290deg); } 100% { transform: translateY(0) rotate(360deg); } }
  @keyframes land { 0% { transform: scale(1.18, .8); } 60% { transform: scale(.95, 1.06); } 100% { transform: scale(1); } }
  @keyframes scorejig { 0% { transform: translateY(0) rotate(0) scale(1); } 40% { transform: translateY(-12px) rotate(-5deg) scale(1.14); }
    70% { transform: translateY(-10px) rotate(3deg) scale(1.08); } 100% { transform: translateY(-10px) scale(1.08); } }
  @keyframes crack { 0% { transform: none; filter: none; } 20% { transform: translateX(-4px) rotate(-6deg); } 40% { transform: translateX(4px) rotate(6deg); filter: brightness(1.6); }
    100% { transform: translateY(18px) scale(.2) rotate(40deg); opacity: 0; } }

  /* ---------- hand + points x bonus ---------- */
  .handLabel { font-size: 18px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; height: 26px; white-space: nowrap; flex: none; }
  .calc { display: flex; align-items: flex-start; gap: 10px; margin-top: 4px; flex: none; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .slot .lbl { opacity: .75; }
  .box { min-width: 96px; height: 50px; padding: 0 10px; border-radius: 12px; display: grid; place-items: center;
    font-size: 28px; font-weight: 900; background: #100e18; border: 3px solid; }
  .ptsBox { color: var(--pts); border-color: var(--pts); text-shadow: 0 0 14px var(--pts); }
  .bonBox { color: var(--bon); border-color: var(--bon); text-shadow: 0 0 14px var(--bon); }
  .sym { font-size: 26px; font-weight: 900; height: 50px; display: grid; place-items: center; }
  .scoreOut { min-width: 110px; height: 50px; display: grid; place-items: center; font-size: 28px; font-weight: 900; color: #ffd23f; }
  .ticker { height: 26px; margin-top: 4px; font-size: 15px; font-weight: 800; white-space: nowrap; opacity: 0; transition: opacity .2s; flex: none; }
  .ticker .val { margin-left: 8px; font-weight: 900; }
  .ticker .val.pts { color: var(--pts); } .ticker .val.bon { color: var(--bon); } .ticker .val.cash { color: #ffd23f; }
  #hand.collapsed .ticker { opacity: 1; }
  .btns { display: flex; gap: 14px; margin-top: auto; flex: none; }
  .btn { padding: 0 20px; height: 48px; border-radius: 14px; font-size: 18px; font-weight: 900; letter-spacing: .02em;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.25), 0 6px 12px rgba(0,0,0,.35); }
  .btn.reroll { background: #f0a020; color: #2b1800; }
  .btn.play { background: #2fb36b; color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.14); color: #fff; }
  .btn.small { height: 38px; font-size: 15px; padding: 0 14px; }
  .btn:not(:disabled):active { transform: translateY(2px); }
  .pips { display: flex; gap: 5px; }
  .pip { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .pip.on { background: #fff; }

  /* ---------- score sheet ---------- */
  .sheetWrap { width: 250px; flex: none; display: flex; flex-direction: column; gap: 6px; transition: width .25s ease; overflow: hidden; }
  #hand.collapsed .sheetWrap { width: 40px; }
  .sheetHead { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: rgba(0,0,0,.28); border-radius: 10px; padding: 0 10px; font-size: 12px; font-weight: 900; letter-spacing: .08em; white-space: nowrap; }
  #hand.collapsed .sheetHead { padding: 0; justify-content: center; }
  #hand.collapsed .sheetHead .ttl { display: none; }
  .collapsedTab { display: none; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 900;
    letter-spacing: .2em; opacity: .7; align-self: center; margin-top: 8px; }
  #hand.collapsed .collapsedTab { display: block; }
  .sheet { flex: 1; min-height: 0; background: #f7f0de; color: #2a2016; border-radius: 12px; padding: 0 10px; display: flex; flex-direction: column;
    background-image: repeating-linear-gradient(#f7f0de 0 25px, #e6dabd 25px 26px); box-shadow: 0 6px 14px rgba(0,0,0,.4); transition: opacity .2s; }
  #hand.collapsed .sheet { opacity: 0; pointer-events: none; }
  .lines { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-bottom: 6px; }
  .lines::-webkit-scrollbar { display: none; }
  .line { display: flex; justify-content: space-between; gap: 6px; height: 26px; align-items: center;
    font-size: 14px; font-weight: 700; white-space: nowrap; }
  .line .lab { overflow: hidden; text-overflow: ellipsis; }
  .line .val { font-weight: 900; }
  .line .val.pts { color: var(--pts-ink); } .line .val.bon { color: var(--bon-ink); } .line .val.cash { color: #9a6a00; } .line .val.bad { color: #8a2a00; }
  .line.sec { font-weight: 900; }
  .line.sec .lab::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px;
    background: #2a2016; vertical-align: 1px; }
  .line.sec.sw-red .lab::before { background: #d1343b; } .line.sec.sw-blue .lab::before { background: #2a5fe0; }
  .line.sec.sw-green .lab::before { background: #1f9555; } .line.sec.sw-yellow .lab::before { background: #e0a000; }
  .line.sec.sw-purple .lab::before { background: #7b3fd6; }
  .line.head { font-size: 11px; font-weight: 900; letter-spacing: .12em; opacity: .55; text-transform: uppercase; }
  .line.sub { padding-left: 16px; font-size: 13px; font-weight: 700; }
  .line.sub .lab::before { content: "\21B3  "; opacity: .55; }
  .line.result { border-top: 2px solid #2a2016; height: 30px; font-size: 15px; font-weight: 900; margin-top: 2px; }
  .line.result .val { color: #9a6a00; font-size: 16px; }
  .line.new .lab { animation: write .28s steps(12) both; }
  .line.new .val { animation: valin .2s ease-out .22s both; }
  @keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes valin { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: none; } }
  .sheet .cw-red { color: #c62a31; } .sheet .cw-blue { color: #2453c7; } .sheet .cw-green { color: #17804a; }
  .sheet .cw-yellow { color: #a87800; } .sheet .cw-purple { color: #6a2fc0; }
  .cw-red { color: #ff7a7f; } .cw-blue { color: #79a8ff; } .cw-green { color: #5ee09b; }
  .cw-yellow { color: #ffd34d; } .cw-purple { color: #c49bff; }

  /* ---------- shop ---------- */
  .shopTop { display: flex; width: 100%; align-items: center; justify-content: space-between; height: 56px; flex: none; }
  .stall { position: relative; display: flex; align-items: flex-start; gap: 18px; margin-top: 4px; flex: none; }
  .stall .shelf { position: absolute; left: -16px; right: -16px; top: 116px; height: 14px; border-radius: 4px;
    background: linear-gradient(#9a6a3e, #5e3b1e); box-shadow: 0 8px 12px rgba(0,0,0,.5); }
  .offers { display: flex; gap: 22px; }
  .offer { width: 128px; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; }
  .offer .bagSvg { width: 112px; height: 122px; animation: sway 3.4s ease-in-out infinite; transform-origin: 50% 28%;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,.45)); transition: transform .2s; }
  .offer:nth-child(2) .bagSvg { animation-delay: -1.1s; } .offer:nth-child(3) .bagSvg { animation-delay: -2.2s; }
  .offer.sel .bagSvg { animation: none; transform: translateY(-10px) scale(1.06); filter: drop-shadow(0 0 14px rgba(255,220,140,.7)) drop-shadow(0 12px 8px rgba(0,0,0,.5)); }
  @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  .ptag { position: absolute; top: 34px; right: 2px; background: #f4e6c4; color: #3b2408; font-weight: 900; font-size: 14px; padding: 2px 7px 2px 10px;
    border-radius: 3px 6px 6px 3px; box-shadow: 0 3px 6px rgba(0,0,0,.4); transform: rotate(8deg); }
  .ptag::before { content: ""; position: absolute; left: 3px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: #3b2408; }
  .offer .oname { font-size: 15px; font-weight: 900; margin-top: 14px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .offer .odesc { font-size: 12px; font-weight: 700; opacity: .75; margin-top: 1px; text-align: center; height: 30px; }
  .offer .buy { display: none; height: 30px; padding: 0 16px; border-radius: 10px; background: #ffd23f; color: #3b2a00; font-weight: 900; font-size: 15px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); margin-top: 1px; }
  .offer.sel .odesc { display: none; } .offer.sel .buy { display: block; animation: slam .25s ease-out; }
  .offer.sold { cursor: default; } .offer.sold .bagSvg, .offer.sold .ptag { visibility: hidden; }
  .offer.sold .soldMark { display: grid; }
  .soldMark { display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%) rotate(-10deg); place-items: center;
    border: 3px solid rgba(255,255,255,.35); color: rgba(255,255,255,.45); font-weight: 900; letter-spacing: .15em; padding: 2px 10px; border-radius: 8px; }
  .offerSide { display: flex; flex-direction: column; justify-content: center; gap: 8px; height: 116px; }
  .bagSvg .ruffle, .bagSvg .tie, .bagSvg .mouth { transition: transform .25s ease, opacity .25s ease; transform-box: view-box; transform-origin: 60px 36px; }
  .bagSvg .mouth { opacity: 0; }
  .bagSvg.open .ruffle { transform: scale(1.45, .8) translateY(-4px); }
  .bagSvg.open .tie { transform: translateY(6px) scaleX(1.25); opacity: 0; }
  .bagSvg.open .mouth { opacity: 1; }
  .bagStage { position: absolute; left: 50%; top: 50%; width: 190px; height: 208px; margin: -104px 0 0 -95px; z-index: 1; }
  .bagStage .bagSvg { width: 100%; height: 100%; filter: drop-shadow(0 0 30px rgba(255,220,140,.35)); }
  .bagStage.shaking .bagSvg { animation: bagShake .75s ease-in-out; transform-origin: 50% 80%; }
  @keyframes bagShake { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-7deg); } 30% { transform: rotate(7deg) translateY(-4px); }
    45% { transform: rotate(-9deg); } 60% { transform: rotate(9deg) translateY(-6px); } 80% { transform: rotate(-3deg) translateY(-2px); } }
  .rackWrap { margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; position: relative; }
  .rackLabels { display: flex; gap: 22px; font-size: 10px; font-weight: 900; letter-spacing: .14em; opacity: .65; margin-bottom: 4px; }
  .rack { display: flex; gap: 8px; height: 72px; align-items: flex-start; padding-top: 6px; }
  .rack .ft { --s: 52px; cursor: grab; touch-action: none; transition: transform .15s; }
  .rack .ft:nth-child(6) { margin-left: 22px; }

<script>
// ================================================================ content (mirrors src/shared/Content.luau)
const COLORS = ["red", "blue", "green", "yellow", "purple"];
const NUMBER_HANDS = { five: ["Five of a Kind", 150, 50], four: ["Four of a Kind", 80, 35], large_straight: ["Large Straight", 60, 30],
  full_house: ["Full House", 50, 25], small_straight: ["Small Straight", 40, 20], three: ["Three of a Kind", 35, 20],
  two_pair: ["Two Pair", 25, 15], pair: ["Pair", 15, 10], high: ["High Die", 5, 5] };
const COLOR_HANDS = { flush: ["Flush", 10, 3], c_four: ["Color Four", 7, 3], c_full_house: ["Color Full House", 6, 2], rainbow: ["Rainbow", 5, 2],
  c_three: ["Color Three", 4, 2], c_two_pair: ["Two Color Pair", 3, 1], c_pair: ["Color Pair", 2, 1] };
const BASE_TARGETS = [150, 400, 1000, 2500, 6000, 13000, 25000, 45000];
const ROUNDS = [["Small Round", 1, 3], ["Big Round", 1.5, 4], ["Boss Round", 2, 5]];
const cap = s => s[0].toUpperCase() + s.slice(1);
const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];
const sample = (arr, n) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); };
const face = (n, color, stamp) => ({ n, color, stamp });
const PIP_CELLS = { 1: [4], 2: [2, 6], 3: [2, 4, 6], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

const MATS = {
  plain: { badge: "", text: "" },
  glass: { badge: "GLASS ×2", text: "×2 bonus when it scores. 1 in 4: that face shatters" },
  steel: { badge: "STEEL", text: "In reserve: ×1.5 bonus every hand" },
  gold:  { badge: "GOLD", text: "In reserve: +$3 for each round you win" },
};
const STAMPS = {
  pts30: { name: "+30 Points", badge: "+30", cls: "", text: "This face gives +30 points when it scores" },
  bon4:  { name: "+4 Bonus", badge: "+4", cls: "sb", text: "This face gives +4 bonus when it scores" },
  x15:   { name: "×1.5 Bonus", badge: "×1.5", cls: "sb", text: "This face gives ×1.5 bonus when it scores" },
  coin:  { name: "Coin", badge: "$2", cls: "sc", text: "This face gives $2 when it scores" },
  peak:  { name: "Peak", badge: "5+", cls: "sb", text: "×2 bonus when this face scores, if it's 5 or more" },
};
const TOOLS = {
  chisel: { name: "Chisel", icon: "⛏️", target: "face", verb: "Chisel it", text: () => "Remove a face you choose" },
  hammer: { name: "Hammer", icon: "🔨", target: "die", verb: "Hammer it", text: () => "Knock off 30–60% of a die's faces at random" },
  forge:  { name: "Forge", icon: "⚒️", target: "face", verb: "Forge it", text: o => `Set a face to ${o.value}` },
  copy:   { name: "Copy", icon: "🪞", target: "two", verb: "Copy it", text: () => "Copy a face, stamp included, onto another face" },
  paint:  { name: "Paint", icon: "🖌️", target: "face", verb: "Paint it", text: o => `Paint a face <span class="cw-${o.color}" style="filter:brightness(.7)">${o.color}</span>` },
};
const PACKS = {
  dice:     { name: "Dice Bag", icon: "🎲", price: 4, color: "#3466d8", desc: "Pick 1 of 3 dice" },
  workshop: { name: "Tool Bag", icon: "🔨", price: 4, color: "#c98a1a", desc: "Pick 1 of 3 tools" },
  stamp:    { name: "Stamp Bag", icon: "🔖", price: 5, color: "#8a4fd6", desc: "Pick 1 of 3 stamps" },
  ledger:   { name: "Level-Up Bag", icon: "📒", price: 3, color: "#239a5a", desc: "Level up 1 of 3 hands" },
  relic:    { name: "Relic Bag", icon: "🏺", price: 6, color: "#c8363c", desc: "Pick 1 of 3 relics" },
};
const PACK_WEIGHTS = { dice: 3, workshop: 3, stamp: 2, ledger: 2, relic: 2 };
const standard = (size, colors, material = "plain") => ({ size: "d" + size, material,
  faces: Array.from({ length: size }, (_, k) => face(k + 1, colors[k % colors.length])) });
const TEMPLATES = [
  { title: "Solid d6", w: 4, build: () => standard(6, [pick(COLORS)]) },
  { title: "High d8", sub: "Rolls 5–8", w: 3, build: () => { const c = pick(COLORS); return { size: "d8", material: "plain", faces: [5,5,6,6,7,7,8,8].map(n => face(n, c)) }; } },
  { title: "Rainbow d4", w: 3, build: () => { const cs = sample(COLORS, 4); return standard(4, cs); } },
  { title: "Twin d6", w: 3, build: () => { const c = pick(COLORS), n = 1 + rnd(6);
    return { size: "d6", material: "plain", faces: [n, n, n, n, n < 6 ? n + 1 : n - 1, n > 1 ? n - 1 : n + 1].map(v => face(v, c)) }; } },
  { title: "Two-tone d6", w: 3, build: () => { const [a, b] = sample(COLORS, 2); return standard(6, [a, a, a, b, b, b].map((c, k) => c)); } },
  { title: "Glass d12", w: 2, build: () => standard(12, sample(COLORS, 3), "glass") },
  { title: "Steel d6", w: 2, build: () => standard(6, [pick(COLORS)], "steel") },
  { title: "Gold d4", w: 2, build: () => standard(4, [pick(COLORS)], "gold") },
  { title: "Big d20", w: 2, build: () => standard(20, COLORS) },
  { title: "Stamped d6", w: 2, build: () => { const d = standard(6, [pick(COLORS)]); d.faces[rnd(6)].stamp = pick(["pts30", "bon4", "coin"]); return d; } },
];
const RELIC_POOL = [
  { id: "evenkeel", name: "Even Keel", icon: "⚖️", text: "+3 bonus for each even face", onFace: f => f.n % 2 === 0 ? { bon: 3, why: `${f.n} is even` } : null },
  { id: "oddjob", name: "Odd Job", icon: "🎯", text: "+20 points for each odd face", onFace: f => f.n % 2 ? { pts: 20, why: `${f.n} is odd` } : null },
  { id: "crimson", name: "Crimson", icon: "🔥", text: "Red faces: +4 bonus", onFace: f => f.color === "red" ? { bon: 4, why: "red face" } : null },
  { id: "azure", name: "Azure", icon: "💧", text: "Blue faces: +4 bonus", onFace: f => f.color === "blue" ? { bon: 4, why: "blue face" } : null },
  { id: "snake", name: "Snake Eyes", icon: "🐍", text: "Each 1 that scores: ×1.5 bonus", onFace: f => f.n === 1 ? { xbon: 1.5, why: "rolled a 1" } : null },
  { id: "heavy", name: "Heavy Hand", icon: "🪨", text: "+1 bonus for every 5 in the Total", onHand: c => c.total >= 5 ? { bon: Math.floor(c.total / 5), why: `Total ${c.total}` } : null },
  { id: "patience", name: "Patience", icon: "⏳", text: "+4 bonus for each unused reroll", onHand: c => c.rerolls ? { bon: 4 * c.rerolls, why: `${c.rerolls} unused` } : null },
  { id: "mono", name: "Monochrome", icon: "🎨", text: "+2 bonus for each die of your most common color", onHand: c => ({ bon: 2 * c.topColor, why: `${c.topColor} match` }) },
  { id: "summit", name: "Summit", icon: "⛰️", text: "×2 bonus if any die rolls its highest face", onHand: c => c.anyTop ? { xbon: 2, why: "top face" } : null },
];
const RELIC_SLOTS = 5, MAX_DICE = 8, HAND_SIZE = 5;

// ================================================================ state
// S.run is the run (persists across rounds); the rest is the current round.
const S = { tap: "keep", faces: "pips", sheetOpen: true, run: null };
const R = () => S.run;
function starterDice() {
  return Array.from({ length: 6 }, (_, i) => ({ size: "d6", material: "plain",
    faces: Array.from({ length: 6 }, (_, k) => face(k + 1, COLORS[(k + i) % COLORS.length])) }));
}
function newRun() {
  S.run = { ante: 1, round: 0, money: 4, dice: starterDice(), relics: [], levels: {}, shop: null, diceBagShown: 0 };
}
function curRound() {
  const [name, mult, pay] = ROUNDS[R().round];
  return { name, ante: R().ante, target: Math.floor(BASE_TARGETS[Math.min(R().ante, 8) - 1] * mult), pay, boss: R().round === 2 };
}
function resetRound() {
  Object.assign(S, { handsLeft: 3, rerollsLeft: 2, roundScore: 0, marked: Array(HAND_SIZE).fill(false),
    face: R().dice.slice(0, HAND_SIZE).map(d => rnd(d.faces.length)), phase: "rolling" });
}

    const g = AC.ctx.createGain(); g.gain.value = .55; lp.connect(g).connect(AC.ctx.destination); AC.out = lp;

// ================================================================ hands (mirrors Hands.luau)
function numberHand(vals) {
  const count = {}; vals.forEach(v => count[v] = (count[v] || 0) + 1);
  const counts = Object.values(count).sort((a, b) => b - a);
  const uniq = [...new Set(vals)].sort((a, b) => a - b);
  let run = 1, best = 1, bestEnd = uniq[0];
  for (let i = 1; i < uniq.length; i++) { run = uniq[i] === uniq[i - 1] + 1 ? run + 1 : 1; if (run > best) { best = run; bestEnd = uniq[i]; } }
  const kindDice = min => vals.map((v, i) => count[v] >= min ? i : -1).filter(i => i >= 0);
  const straightDice = len => { const want = new Set(); for (let k = 0; k < len; k++) want.add(bestEnd - k);
    const used = new Set(); return vals.map((v, i) => { if (want.has(v) && !used.has(v)) { used.add(v); return i; } return -1; }).filter(i => i >= 0); };
  let id, dice;
  if (counts[0] === 5) [id, dice] = ["five", kindDice(5)];
  else if (counts[0] === 4) [id, dice] = ["four", kindDice(4)];
  else if (best >= 5) [id, dice] = ["large_straight", straightDice(5)];
  else if (counts[0] === 3 && counts[1] === 2) [id, dice] = ["full_house", kindDice(2)];
  else if (best >= 4) [id, dice] = ["small_straight", straightDice(4)];
  else if (counts[0] === 3) [id, dice] = ["three", kindDice(3)];
  else if (counts[0] === 2 && counts[1] === 2) [id, dice] = ["two_pair", kindDice(2)];
  else if (counts[0] === 2) [id, dice] = ["pair", kindDice(2)];
  else { const hi = Math.max(...vals); [id, dice] = ["high", [vals.indexOf(hi)]]; }
  return { id, name: NUMBER_HANDS[id][0], pts: handPts(id), dice };
}
function colorHand(cols) {
  const count = {}; cols.forEach(c => count[c] = (count[c] || 0) + 1);
  const byCount = Object.entries(count).sort((a, b) => b[1] - a[1]);
  const [c1, n1] = byCount[0], [c2, n2] = byCount[1] || [null, 0];
  const w = c => `<span class="cw-${c}">${cap(c)}</span>`;
  let id, html;
  if (n1 === 5) { id = "flush"; html = `${w(c1)} Flush`; }
  else if (n1 === 4) { id = "c_four"; html = `${w(c1)} Four`; }
  else if (n1 === 3 && n2 === 2) { id = "c_full_house"; html = `${w(c1)}-${w(c2)} House`; }
  else if (byCount.length === 5) { id = "rainbow"; html = `<span class="cw-red">R</span><span class="cw-yellow">a</span><span class="cw-green">i</span><span class="cw-blue">n</span><span class="cw-purple">bow</span>`; }
  else if (n1 === 3) { id = "c_three"; html = `${w(c1)} Three`; }
  else if (n1 === 2 && n2 === 2) { id = "c_two_pair"; html = `${w(c1)} &amp; ${w(c2)} Pairs`; }
  else { id = "c_pair"; html = `${w(c1)} Pair`; }
  return { id, html, bon: handBon(id), top: n1 };
}

// ================================================================ scoring (mirrors Scoring.luau)
// Sheet levels: "sec" = a die's own points or a whole-hand effect; "sub" = something a die triggered.
function stampStep(f, i) {
  const s = f.stamp; if (!s) return null;
  if (s === "pts30") return { die: i, lvl: "sub", pts: 30, label: "+30 points stamp" };
  if (s === "bon4") return { die: i, lvl: "sub", bon: 4, label: "+4 bonus stamp" };
  if (s === "x15") return { die: i, lvl: "sub", xbon: 1.5, label: "×1.5 bonus stamp" };
  if (s === "coin") return { die: i, lvl: "sub", money: 2, label: "Coin stamp" };
  if (s === "peak" && f.n >= 5) return { die: i, lvl: "sub", xbon: 2, label: "Peak stamp" };
  return null;
}
function scoreHand() {
  const fs = faces(), vals = fs.map(f => f.n), total = vals.reduce((a, b) => a + b, 0);
  const nh = numberHand(vals), ch = colorHand(fs.map(f => f.color));
  const anyTop = fs.some((f, i) => f.n >= Math.max(...R().dice[i].faces.map(x => x.n)));
  const steps = [{ src: "hand", pts: nh.pts, bon: ch.bon }];
  fs.forEach((f, i) => {
    const d = R().dice[i];
    steps.push({ die: i, lvl: "sec", color: f.color, pts: f.n, label: `Rolled ${f.n}` });
    const st = stampStep(f, i); if (st) steps.push(st);
    if (d.material === "glass") steps.push({ die: i, lvl: "sub", xbon: 2, label: "Glass" });
    R().relics.forEach(r => { const h = r.onFace && r.onFace(f); if (h) steps.push({ die: i, relic: r.id, lvl: "sub", ...h, label: `${r.name}: ${h.why}` }); });
  });
  const after = [];
  reserveDice().forEach((d, k) => { if (d.material === "steel") after.push({ reserve: k, lvl: "sec", xbon: 1.5, label: "Steel die in reserve" }); });
  const ctx = { total, rerolls: S.rerollsLeft, topColor: ch.top, anyTop };
  R().relics.forEach(r => { const h = r.onHand && r.onHand(ctx); if (h) after.push({ relic: r.id, lvl: "sec", ...h, label: `${r.name}: ${h.why}` }); });
  if (S.rerollsLeft > 0) after.push({ src: "money", lvl: "sec", money: S.rerollsLeft, label: `${S.rerollsLeft} unused reroll${S.rerollsLeft > 1 ? "s" : ""}` });
  if (after.length) steps.push({ heading: "Whole hand" }, ...after);
  return { nh, ch, total, steps };
}

// ================================================================ drag to reorder (hand row and shop rack)
function dragReorder(n, box, onSwap, onTap, canDrag) {
  n.addEventListener("pointerdown", e => {
    if (!canDrag()) return;
    const startX = e.clientX, grab = (e.clientX - n.getBoundingClientRect().left) / scale;
    let dragging = false; n.setPointerCapture(e.pointerId);
    const move = ev => {
      if (!dragging && Math.abs(ev.clientX - startX) > 8) { dragging = true; n.classList.add("dragging"); }
      if (!dragging) return;
      const left = (ev.clientX - box.getBoundingClientRect().left) / scale - grab, mid = left + n.offsetWidth / 2;
      for (let moved = true; moved;) {
        const kids = [...box.children], idx = kids.indexOf(n), next = kids[idx + 1], prev = kids[idx - 1]; moved = false;
        if (next && mid > next.offsetLeft + next.offsetWidth / 2) { box.insertBefore(next, n); onSwap(idx, idx + 1); moved = true; }
        else if (prev && mid < prev.offsetLeft + prev.offsetWidth / 2) { box.insertBefore(n, prev); onSwap(idx, idx - 1); moved = true; }
        if (moved) { [...box.children].forEach((c, k) => c.dataset.i = k); SFX.slide(); }
      }
      n.style.transform = `translateX(${left - n.offsetLeft}px) translateY(-6px) scale(1.08)`;
    };
    const up = () => {
      n.removeEventListener("pointermove", move); n.removeEventListener("pointerup", up); n.removeEventListener("pointercancel", up);
      if (dragging) { n.classList.remove("dragging"); n.style.transform = ""; onTap(null); } else onTap(+n.dataset.i);
    };
    n.addEventListener("pointermove", move); n.addEventListener("pointerup", up); n.addEventListener("pointercancel", up);
  });
}

// ================================================================ hand screen: scoring playback
async function play() {

  const res = scoreHand(); let pts = 0, bon = 0, dur = 420, k = 0;
  const ptsEl = el("pts"), bonEl = el("bon"), ticker = el("ticker");

  $("#hand").querySelectorAll(".die").forEach(n => n.classList.remove("inhand"));
  for (const st of res.steps) {
    if (st.heading) { sheetAdd(line("head", st.heading)); continue; }
    const dn = st.die != null ? dieEl(st.die) : null, rn = st.relic ? relicEl(st.relic) : null;
    const resv = st.reserve != null ? el("reserve").querySelector(`[data-reserve="${st.reserve}"]`) : null;
    $("#hand").querySelectorAll(".die.scoring").forEach(n => n !== dn && n.classList.remove("scoring"));
    if (dn && !dn.classList.contains("scoring")) dn.classList.add("scoring");
    if (rn) restart(rn, "trigger"); if (resv) restart(resv, "bump");
    const src = rn || dn || resv || el("money");
    if (st.src === "hand") {
      const hl = el("handLabel"); hl.innerHTML = `${res.nh.name} · ${res.ch.html}`; restart(hl, "flash"); SFX.hand();
      sheetAdd(line("head", "Hand") + line("sec", res.nh.name + lvTag(res.nh.id), `${st.pts} points`, "pts") + line("sec", res.ch.html + lvTag(res.ch.id), `${st.bon} bonus`, "bon"));
      ticker.innerHTML = `${res.nh.name} · ${res.ch.html}`;
      pop(ptsEl, `${st.pts}`, "pts"); pop(bonEl, `${st.bon}`, "bon");
      pts = st.pts; bon = st.bon; ptsEl.textContent = fmt(pts); bonEl.textContent = fmt(bon); hit(ptsEl, "glowP"); hit(bonEl, "glowB");
      await wait(dur + 200); if (g !== gen) return;
      sheetAdd(line("head", "Dice"));
      continue;
    }
    const [vt, vk] = stepVal(st);
    sheetAdd(line(st.lvl + (st.lvl === "sec" && st.color ? ` sw-${st.color}` : ""), st.label, vt, vk)); SFX.write();
    ticker.innerHTML = `${st.label}<span class="val ${vk}">${vt}</span>`;
    if (st.pts) { pop(src, `+${st.pts}`, "pts"); SFX.pts(k++); pts += st.pts; ptsEl.textContent = fmt(pts); hit(ptsEl, "glowP"); }
    else if (st.bon) { pop(src, `+${st.bon} bonus`, "bon"); SFX.bon(k++); bon += st.bon; bonEl.textContent = fmtB(bon); hit(bonEl, "glowB"); }
    else if (st.xbon) { pop(src, `×${st.xbon} bonus`, "xbon"); SFX.xbon(); k++; bon *= st.xbon; bonEl.textContent = fmtB(bon); hit(bonEl, "glowB"); restart($("#hand"), "shake"); }

  sheetAdd(`<div class="line new result"><span class="lab">${fmt(pts)} × ${fmtB(bon)}</span><span class="val">${fmt(score)}</span></div>`);
  el("sheetTitle").textContent = `LAST HAND · ${fmt(score)}`;
  ticker.innerHTML = `${fmt(pts)} points × ${fmtB(bon)} bonus = <b>${fmt(score)}</b>`;
  await wait(700); if (g !== gen) return;
  // Glass: each glass face that scored has a 1 in 4 chance to shatter (removed from its die).
  for (let i = 0; i < HAND_SIZE; i++) {
    const d = R().dice[i];
    if (d.material === "glass" && d.faces.length > 2 && Math.random() < 0.25) {
      const f = d.faces[S.face[i]]; d.faces.splice(S.face[i], 1); S.face[i] = 0;
      pop(dieEl(i), "Shattered!", "bad"); restart(dieEl(i), "shake"); SFX.crack();
      sheetAdd(line("sec", `Glass face ${f.n} shattered`, `${d.faces.length} faces left`, "bad"));

  await countTo(el("round"), before, S.roundScore, 650, () => SFX.tick());

  S.handsLeft -= 1; pips(el("hands"), S.handsLeft, 3);

  if (S.handsLeft === 0) return lost();
  S.rerollsLeft = 2; S.marked = S.marked.map(() => false);

}

// ================================================================ packs
function packOptions(kind) {

    while (ts.length < 3) { const total = pool.reduce((s, t) => s + t.w, 0); let x = Math.random() * total;
      const t = pool.find(t => (x -= t.w) < 0) || pool[0]; ts.push(t); pool.splice(pool.indexOf(t), 1); }
    return ts.map(t => ({ kind: "die", title: t.title, sub: t.sub, die: t.build() }));
  }
  if (kind === "workshop") return sample(Object.keys(TOOLS), 3).map(id => ({ kind: "tool", tool: id, value: 1 + rnd(8), color: pick(COLORS) }));
  if (kind === "stamp") return sample(Object.keys(STAMPS), 3).map(id => ({ kind: "stamp", stamp: id }));
  if (kind === "ledger") return sample([...Object.keys(NUMBER_HANDS).filter(h => h !== "high"), ...Object.keys(COLOR_HANDS)], 3).map(h => ({ kind: "level", hand: h }));
  const owned = new Set(R().relics.map(r => r.id));

    const now = tb[o.hand][1] + tb[o.hand][2] * (l - 1), nxt = now + tb[o.hand][2];

      else T.face = j;
      SFX.mark(); draw(); }));
    ov.querySelector("[data-act=back]").addEventListener("click", e => { e.stopPropagation(); showCards(kind, opts); });
    ov.querySelector("[data-act=ok]").addEventListener("click", e => { e.stopPropagation(); apply(); });
  };
  const apply = async () => {
    const g = gen, d = R().dice[T.die], faceEls = [...ov.querySelectorAll("[data-f]")];
    ov.querySelectorAll("button").forEach(b => b.disabled = true);
    const fail = m => { T.msg = m; SFX.nope(); draw(); };
    if (t && (o.tool === "chisel" || o.tool === "hammer") && d.faces.length <= 2) return fail("A die keeps at least 2 faces");
    if (o.tool === "chisel") { faceEls[T.face].classList.add("crack"); SFX.crack(); await wait(520); if (g !== gen) return; d.faces.splice(T.face, 1); }
    else if (o.tool === "hammer") {
      const remove = Math.max(1, Math.min(d.faces.length - 2, Math.round(d.faces.length * (0.3 + Math.random() * 0.3))));
      const gone = sample(d.faces.map((_, j) => j), remove).sort((a, b) => b - a);
      restart(ov.querySelector(`[data-d="${T.die}"]`), "shake");
      for (const j of gone.slice().reverse()) { faceEls[j].classList.add("crack"); SFX.crack(); await wait(260); if (g !== gen) return; }
      await wait(300); gone.forEach(j => d.faces.splice(j, 1));
    }
    else if (o.tool === "forge") { SFX.clink(); restart(faceEls[T.face], "glowFace"); await wait(250); d.faces[T.face].n = o.value; }
    else if (o.tool === "paint") { SFX.swish(); restart(faceEls[T.face], "glowFace"); await wait(250); d.faces[T.face].color = o.color; }
    else if (o.tool === "copy") { SFX.swish(); restart(faceEls[T.face], "glowFace"); await wait(250); d.faces[T.face] = { ...R().dice[T.src.die].faces[T.src.face] }; }
    else { SFX.thunk(); restart(faceEls[T.face], "glowFace"); await wait(200); d.faces[T.face].stamp = o.stamp; }
    T.msg = ""; draw(); ov.querySelectorAll("button").forEach(b => b.disabled = true);
    if (o.tool === "forge" || o.tool === "paint" || o.tool === "copy" || !t) { const n = ov.querySelectorAll("[data-f]")[T.face]; if (n) restart(n, "slam"); }
    await wait(900); if (g !== gen) return; closePack();
  };
  draw();
}

// ================================================================ controls
stage.addEventListener("click", () => { if (S.phase === "scoring" || S.phase === "over") speed = 0.35;
  stage.querySelectorAll(".relic.show").forEach(x => x.classList.remove("show")); });
$("#hand [data-act=reroll]").addEventListener("click", e => { e.stopPropagation();
  if (S.phase !== "choosing" || S.rerollsLeft === 0) return; const idx = rerollSet(); if (!idx.length) return;
  S.rerollsLeft -= 1; roll(idx); });
$("#hand [data-act=play]").addEventListener("click", e => { e.stopPropagation(); if (S.phase === "choosing") play(); });
$("#hand [data-act=sheet]").addEventListener("click", e => { e.stopPropagation(); S.sheetOpen = !S.sheetOpen; updateHand(); });
stage.querySelectorAll("[data-act=settings]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); paintSettings(); $("#settings").classList.add("show"); }));
$("#setDone").addEventListener("click", e => { e.stopPropagation(); $("#settings").classList.remove("show"); });
function paintSettings() {
  stage.querySelectorAll(".seg").forEach(seg => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", S[seg.dataset.set] === b.dataset.v)));
}
stage.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", e => { e.stopPropagation();
  const key = b.parentElement.dataset.set; if (S[key] === b.dataset.v) return;
  S[key] = b.dataset.v; if (key === "tap") S.marked = S.marked.map(() => false); paintSettings();
  if ($("#hand").classList.contains("on")) updateHand(); else renderShop(); }));
$("#shop [data-act=shopReroll]").addEventListener("click", e => { e.stopPropagation(); const sh = R().shop;
  if (R().money < sh.rerollCost) return; R().money -= sh.rerollCost; sh.rerollCost += 1; sh.offers = rollOffers(); sh.pick = null; SFX.coin(); SFX.deal(); renderShop(); });
$("#shop [data-act=nextRound]").addEventListener("click", e => { e.stopPropagation(); const nx = nextRoundOf(R());
  if (nx.ante > 8) { showOverlay("Run won", "You beat all 8 antes"); const b = $("#ovBtn"); b.textContent = "New run"; b.style.visibility = "visible"; SFX.win();
    b.onclick = ev => { ev.stopPropagation(); startRun(); }; return; }
  R().ante = nx.ante; R().round = nx.round; startRound(); });
$("#shop [data-act=levels]").addEventListener("click", e => { e.stopPropagation();
  const row = (tb, id, cls) => `<div><span>${tb[id][0]} <span class="lv">Lv ${lvl(id)}</span></span><span class="${cls}">${tb[id][1] + tb[id][2] * (lvl(id) - 1)}</span></div>`;
  const nk = Object.keys(NUMBER_HANDS), ck = Object.keys(COLOR_HANDS);
  let html = `<div class="h">NUMBER HANDS · POINTS</div><div class="h">COLOR HANDS · BONUS</div>`;
  for (let k = 0; k < nk.length; k++) html += row(NUMBER_HANDS, nk[k], "p") + (ck[k] ? row(COLOR_HANDS, ck[k], "b") : "<div></div>");
  $("#lvlTable").innerHTML = html; $("#levelsOv").classList.add("show"); });
$("#levelsDone").addEventListener("click", e => { e.stopPropagation(); $("#levelsOv").classList.remove("show"); });

function startRound() {
  gen++; fx.innerHTML = ""; $("#overlay").classList.remove("show"); $("#packOv").classList.remove("show");
  showScreen("hand"); makeRelics(el("relics"), true);
  el("lines").innerHTML = ""; el("sheetTitle").textContent = "SCORE SHEET"; el("score").textContent = "";
  el("dice").innerHTML = ""; resetRound(); roll([0, 1, 2, 3, 4]);
}
function startRun() { newRun(); startRound(); }

// ================================================================ prototype bar
function setSnd() { $("#sndBtn").textContent = AC.on ? "Sound on" : "Sound off"; }
$("#sndBtn").onclick = () => { AC.on = !AC.on; setSnd(); };
$("#shopBtn").onclick = () => { R().money += 20; enterShop(); };
$("#newBtn").onclick = () => startRun();
$("#notesBtn").onclick = () => $("#notes").classList.toggle("show");
$("#notes").innerHTML = `<h3>Hand screen</h3><ol>
    <li><b>Round and ante</b> — Small, Big, then Boss round; 8 antes win the run.</li>
    <li><b>Score to beat and round score</b> — your 3 hands add up toward the target.</li>
    <li><b>Hands and rerolls left</b> — each unused reroll pays $1.</li>
    <li><b>Reserve</b> — your dice beyond the 5 you roll. Steel and Gold dice work from here.</li>
    <li><b>Relics</b> — always-on bonuses. Tap to read. They wiggle when they add.</li>
    <li><b>Your 5 dice</b> — tap to keep (or mark to reroll, in settings), drag to reorder. Dice score left to right.</li>
    <li><b>Points × Bonus</b> — number hand and dice make points; color hand and relics make bonus.</li>
    <li><b>Score sheet</b> — hand, then each die with what it triggered, then whole-hand effects. Stays up after the hand.</li>
  </ol><h3>Shop</h3><ol>
    <li><b>Bags</b> — 3 for sale; tap one, then Buy. Every ante's first shop has a Dice Bag. Reroll the shop for $2, rising $1 each time.</li>
    <li><b>Next round</b> — what's coming and its target.</li>
    <li><b>Your dice</b> — the first 5 roll; the rest are reserve. Drag to rearrange, tap to see a die's faces. The bar under each die is its color mix.</li>
    <li><b>Hand levels</b> — what each hand is worth now; Ledgers raise them.</li>
  </ol><h3>Opening a bag</h3><ol>
    <li><b>Pick 1 of 3</b>, or skip.</li>
    <li><b>Tools and stamps</b> — then pick a die and a face. Copy: the face to copy, then the face to copy onto. Hammer: just a die.</li>
    <li><b>Full</b> — if your dice (8) or relic slots (5) are full, pick one to give up.</li>
  </ol><p>"Shop now" in this bar jumps to the shop with +$20 to try packs. Not in yet: boss rules, picking which 5 dice to roll before a round.</p>`;

function fit() { scale = Math.min(innerWidth / 844, (innerHeight - 46) / 390); stage.style.transform = `scale(${scale})`; }
addEventListener("resize", fit); fit(); setSnd();
startRun();
</script>
</body>
