<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// ================================================================ sound (same synth as the Adventure mockup)
const AC = { ctx: null, on: true, out: null, noise: null, armed: false };
function audio() {
  if (!AC.armed) return null;
  if (!AC.ctx) {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    AC.ctx = new C();
    const lp = AC.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3800; lp.Q.value = .5;
    const g = AC.ctx.createGain(); g.gain.value = .55; lp.connect(g).connect(AC.ctx.destination); AC.out = lp;
    AC.noise = AC.ctx.createBuffer(1, AC.ctx.sampleRate, AC.ctx.sampleRate);
    const d = AC.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.ctx.state === "suspended") AC.ctx.resume();
  return AC.on ? AC.ctx : null;
}
addEventListener("pointerdown", () => { AC.armed = true; audio(); });
function tone(freq, dur, type = "sine", vol = .3, when = 0, slideTo) {
  const c = audio(); if (!c) return; const t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(AC.out); o.start(t); o.stop(t + dur + .03);
}
function hiss(dur, freq, q = 1, vol = .3, when = 0) {
  const c = audio(); if (!c) return; const t = c.currentTime + when;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = AC.noise;
  f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(AC.out); s.start(t, Math.random() * .5); s.stop(t + dur + .03);
}
const semis = k => Math.pow(2, Math.min(k, 24) / 12);
const SFX = {
  rattle() { for (let k = 0; k < 3; k++) hiss(.03, 1600 + Math.random() * 1600, 2.5, .25, k * .045 + Math.random() * .02); },
  land(v = .4) { tone(170 + Math.random() * 50, .12, "sine", v, 0, 75); hiss(.04, 1100, 1.5, v * .5); },
  link(k) { tone(392 * semis(k), .12, "triangle", .2); },
  tick(k) { tone(660 * semis(k % 12), .05, "triangle", .07); },
  coin() { tone(1175, .07, "triangle", .1); tone(1568, .22, "sine", .14, .05); },
  buy() { tone(523, .12, "triangle", .25); tone(784, .2, "triangle", .22, .08); tone(1047, .3, "sine", .16, .16); },
  no() { tone(180, .18, "square", .08, 0, 120); },
  thunk() { tone(110, .3, "sine", .5, 0, 45); hiss(.15, 400, .8, .3); },
  pick() { tone(620, .06, "triangle", .2); },
  whoosh() { hiss(.3, 700, .9, .2); },
  rev() { tone(220, .45, "sawtooth", .07, 0, 880); hiss(.35, 1200, .9, .15); tone(880, .2, "triangle", .15, .4); },
  sparkle() { [784, 988, 1175, 1568, 1976].forEach((f, k) => tone(f, .25, "triangle", .14, k * .06)); },
};

// ================================================================ scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8cc3f0); scene.fog = new THREE.Fog(0x8cc3f0, 90, 190);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .5, 400);
scene.add(new THREE.HemisphereLight(0xe6f2ff, 0x4f6b35, 1.25));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.9);
sun.position.set(60, 70, 45); sun.target.position.set(35, 0, 0); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 45, bottom: -45, near: 10, far: 220 }); sun.shadow.bias = -.0004;

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, ...o });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), std(0x6bb85a));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function plot(x) {

  { key: "hot",    name: "Hot Hands",   w: 22, color: "#ff7a1f", dur: 30000, speed: 3,  msg: "×3 roll speed" },
  { key: "warp",   name: "Time Warp",   w: 22, color: "#9fd0ff", instant: "warp" },

const buffs = [];
function applyBuffs(s) {

    if (b.combo) s.combo *= b.combo;

}

// ================================================================ loop
let last = performance.now(), hudT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (t - last) / 1000); now += (t - last) * SPEED; last = t;
  for (const tw of tweens.slice()) {
    if (now < tw.t0) continue; const e = Math.min(1, (now - tw.t0) / tw.dur);
    try { tw.fn(e); } catch (err) { console.error(err); tweens.splice(tweens.indexOf(tw), 1); tw.res(); continue; }
    if (e >= 1) { tweens.splice(tweens.indexOf(tw), 1); tw.res(); }
  }
  mine.tick(); theirs.tick(); prestigeTick(dt);
  powersFrame(dt); // powers cooldowns, buffs, shiny die, Mikey

  if (mode === "walk") {
    let mx = stick.x + ((keys.d || keys.arrowright) ? 1 : 0) - ((keys.a || keys.arrowleft) ? 1 : 0);
    let mz = stick.y + ((keys.s || keys.arrowdown) ? 1 : 0) - ((keys.w || keys.arrowup) ? 1 : 0);
    const l = Math.hypot(mx, mz);
    if (l > .08) {
      if (l > 1) { mx /= l; mz /= l; }
      const sx = Math.cos(yaw) * mx + Math.sin(yaw) * mz, sz = -Math.sin(yaw) * mx + Math.cos(yaw) * mz;
      player.position.x += sx * 17 * dt; player.position.z += sz * 17 * dt; player.rotation.y = Math.atan2(-sx, -sz);
      player.position.y = .4 + Math.abs(Math.sin(now / 90)) * .25;
    } else player.position.y = .4;
    collide(player.position);
    const onMat = Math.abs(player.position.x - MAT.x) < MAT.w / 2 && Math.abs(player.position.z - MAT.z) < MAT.d / 2 + .6;
    if (onMat && matArmed) enterBoard(); if (!onMat) matArmed = true;
    for (const p of pads) {
      const on = Math.hypot(player.position.x - p.x, player.position.z - p.z) < 2.6;
      if (on && p.armed) { p.armed = false; if (buy(p.k) || p.k === "special") tween(300, e => p.mesh.position.y = .55 - Math.sin(Math.PI * e) * .25); }
      if (!on) p.armed = true;
    }
    const tp = player.position.clone().add(new THREE.Vector3(Math.sin(yaw) * 15, 11, Math.cos(yaw) * 15));
    camPos.lerp(tp, 1 - Math.exp(-dt * 6)); camLook.lerp(player.position.clone().add(new THREE.Vector3(-Math.sin(yaw) * 9, 1.5, -Math.cos(yaw) * 9)), 1 - Math.exp(-dt * 8));
    if (camera.fov !== 50) { camera.fov += (50 - camera.fov) * (1 - Math.exp(-dt * 6)); if (Math.abs(camera.fov - 50) < .05) camera.fov = 50; camera.updateProjectionMatrix(); }
  } else {
    const b = boardCam();
    camPos.lerp(b.pos, 1 - Math.exp(-dt * 5)); camLook.lerp(b.look, 1 - Math.exp(-dt * 6));
    camera.fov += (b.fov - camera.fov) * (1 - Math.exp(-dt * 5)); camera.updateProjectionMatrix();
    player.rotation.y = 0;
  }
  camera.position.copy(camPos); camera.lookAt(camLook);

  for (const p of pads) p.mesh.material.emissiveIntensity = S.points >= COST[p.k]() && canBuy(p.k) ? .45 + .3 * Math.sin(now / 200) : .05;
  for (const tg of tags) {
    const s = !tg.hidden && mode === "walk" && camera.position.distanceTo(tg.world) < 110 ? screenOf(tg.world) : null;
    tg.el.style.display = s ? "" : "none"; if (s) { tg.el.style.left = s.x + "px"; tg.el.style.top = s.y + "px"; }
  }
  // Counter eases toward the real total; rate is points over the last 10 seconds.
  S.shown += (S.points - S.shown) * (1 - Math.exp(-dt * 12)); if (Math.abs(S.points - S.shown) < .5) S.shown = S.points;
  if ((hudT -= dt) <= 0) {
    hudT = .1;
    ptsEl.textContent = fmt(S.shown);
    S.earned = S.earned.filter(([t0]) => now - t0 < 10000);
    document.getElementById("rate").textContent = fmt(S.earned.reduce((a, [, v]) => a + v, 0) / 10) + " / sec";
    for (const p of pads) {
      const c = COST[p.k](), ok = canBuy(p.k);
      p.t.el.innerHTML = `${NAMES[p.k]}<small>${ok ? fmt(c) : "Maxed"}</small>`; p.t.el.classList.toggle("poor", ok && S.points < c);
      const btn = document.querySelector(`[data-buy=${p.k}]`); btn.innerHTML = `${NAMES[p.k]}<small>${ok ? fmt(c) : "Maxed"}</small>`; btn.disabled = p.k !== "special" && (!ok || S.points < c); btn.classList.toggle("poor", p.k === "special" && S.points < c);
    }
    const st = (k, v) => document.querySelector(`[data-s=${k}] b`).textContent = v;
    st("dice", `${mine.cells.filter(Boolean).length} / ${N * N}`); st("combo", `+${fmtMult(mine.combo)}× per die`);
    st("speed", `every ${secs(mine.rollMs)}`); st("best", fmt(S.best));
    const goal = ["die", "combo", "speed"].filter(canBuy).sort((a, b) => COST[a]() - COST[b]())[0], pst = prestigeStatus();
    if (pst.ready || !goal) { // everything bought, or the next prestige is the best move → point at prestige

      document.getElementById("goalBar").style.width = Math.min(100, S.runPoints / pst.need * 100) + "%";
    } else {
      document.getElementById("goalName").textContent = `${NAMES[goal]} · ${fmt(COST[goal]())}`;
      document.getElementById("goalBar").style.width = Math.min(100, S.points / COST[goal]() * 100) + "%";
    }

// given time: ceil(120 × 1.6^(specials already owned)). Each kind reads instantly from a floating emblem (a sprite,
// so it faces both the walk camera and the overhead view), a coloured ground ring (overhead), a glow, and a material

  mirror:     { lv: 4, name: "Mirror",     sym: "MAX", col: 0x49e0e0, glow: 0xa6f6f6, dark: true },

    g.beginPath(); g.arc(x * 128, y * 128 + 2.5, 12.5, 0, 7); g.fillStyle = "rgba(0,0,0,.3)"; g.fill();
    g.beginPath(); g.arc(x * 128, y * 128, 12.5, 0, 7); g.fillStyle = "#fff"; g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function specialMats(color, kind) {
  if (kind === "wild") return FACE_AT.map(n => new THREE.MeshStandardMaterial({ map: wildFaceTex(n), roughness: .3, metalness: .2, emissive: new THREE.Color(0x222244), emissiveIntensity: .6 }));
  const tweak = {
    weighted:   { metalness: .75, roughness: .3,  emissive: 0x2b3240, ei: .5 },
    adder:      { metalness: 0,   roughness: .4,  emissive: 0x0f5a33, ei: .6 },
    mirror:     { metalness: .95, roughness: .12, emissive: 0x0d4a4a, ei: .5 },
    multiplier: { metalness: .3,  roughness: .35, emissive: 0x6a5300, ei: .7 },

  return MATS[color].map(m => {
    const c = m.clone();
    if (tweak.metalness != null) c.metalness = tweak.metalness;
    if (tweak.roughness != null) c.roughness = tweak.roughness;
    if (tweak.emissive != null) { c.emissive = new THREE.Color(tweak.emissive); c.emissiveIntensity = tweak.ei || .5; }
    return c;

function badgeTex(kind) {
  const sp = SPECIAL[kind], W = 256, H = 128, c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  const pad = 10, r = 56;
  if (sp.rainbow) { const grd = g.createLinearGradient(0, 0, W, 0); ["#ef4b52", "#f5bf1d", "#2fb36b", "#3f7cf0", "#9b5de5"].forEach((col, k, a) => grd.addColorStop(k / (a.length - 1), col)); g.fillStyle = grd; }
  else g.fillStyle = "#" + hex6(sp.col);
  g.beginPath(); g.roundRect(pad, pad, W - 2 * pad, H - 2 * pad, r); g.fill();
  g.lineWidth = 8; g.strokeStyle = "rgba(0,0,0,.35)"; g.stroke();
  g.fillStyle = (sp.dark || sp.rainbow) ? "#1a1a2a" : "#fff";
  g.font = `900 ${sp.sym.length > 2 ? 58 : 72}px "Trebuchet MS", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(sp.sym, W / 2, H / 2 + 4);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function glowTex() {
  if (glowTex._t) return glowTex._t;
  const s = 128, c = document.createElement("canvas"); c.width = c.height = s; const g = c.getContext("2d");
  const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0, "rgba(255,255,255,1)"); grd.addColorStop(.4, "rgba(255,255,255,.5)"); grd.addColorStop(1, "rgba(255,255,255,0)");

Board.prototype.decorate = function (d, kind) {
  const sp = SPECIAL[kind];
  const emb = new THREE.Sprite(new THREE.SpriteMaterial({ map: badgeTex(kind), transparent: true, depthTest: true })); emb.scale.set(2.7, 1.35, 1);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color: sp.glow, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false })); glow.scale.set(5.2, 5.2, 1);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(CELL * 0.38, .13, 10, 28), new THREE.MeshBasicMaterial({ color: sp.col })); ring.rotation.x = Math.PI / 2;
  this.group.add(glow, ring, emb);
  d.emblem = emb; d.glow = glow; d.ring = ring;
};
Board.prototype.updateDecos = function () {
  const t = now;
  for (let i = 0; i < N * N; i++) {
    const d = this.cells[i]; if (!d || !d.special) continue; const m = d.mesh;
    if (d.ring) { d.ring.position.set(m.position.x, TOP + .1, m.position.z); d.ring.rotation.z += .03; d.ring.scale.setScalar(1 + .08 * Math.sin(t / 260 + i)); }
    if (d.emblem) d.emblem.position.set(m.position.x, m.position.y + DIE * .95 + .22 * Math.sin(t / 420 + i), m.position.z);
    if (d.glow) { d.glow.position.set(m.position.x, m.position.y + DIE * .5, m.position.z); d.glow.material.opacity = .28 + .16 * Math.sin(t / 220 + i); }
    if (d.special === "wild") { // wild shimmers through the rainbow so "counts as every colour" reads at a glance
      const col = new THREE.Color().setHSL((t / 1400 + i * .1) % 1, .9, .6);
      if (Array.isArray(m.material)) m.material.forEach(mm => mm.emissive && mm.emissive.copy(col).multiplyScalar(.4));
      if (d.ring) d.ring.material.color.copy(col); if (d.glow) d.glow.material.color.copy(col);

  }
};
Board.prototype.removeDie = function (i) {
  const d = this.cells[i]; if (!d) return;
  this.group.remove(d.mesh);
  if (Array.isArray(d.mesh.material) && d.mesh.material !== MATS[d.color]) // normal dice share MATS — only dispose per-die clones
    d.mesh.material.forEach(m => { if (d.special === "wild" && m.map) m.map.dispose(); m.dispose(); });
  for (const o of [d.emblem, d.glow, d.ring]) if (o) { this.group.remove(o); if (o.material) { if (o.material.map && o.material.map !== glowTex._t) o.material.map.dispose(); o.material.dispose(); } if (o.geometry) o.geometry.dispose(); }
  this.cells[i] = null;

// --- buying ---
let replaceKind = null;
function buySpecial(kind, cell) {
  const sp = SPECIAL[kind]; if (!sp) return false;
  if ((S.prestige || 0) < sp.lv) { SFX.no(); return false; }
  const cost = specialCost();
  if (S.points < cost) { SFX.no(); return false; }
  let i = (cell == null) ? mine.emptyCell() : cell;
  if (i == null) { closePicker(); startReplace(kind); return "replace"; } // board full: player picks a die to replace
  S.points -= cost; S.shown = Math.min(S.shown, S.points); S.specials++; SFX.buy();
  if (mine.cells[i]) mine.removeDie(i);
  mine.addDie(i, CNAMES[rnd(5)], true, kind);
  flashStat("dice"); cancelReplace(); closePicker();
  announce(`<b>${sp.name}</b> added`);
  return true;
}
function startReplace(kind) {
  replaceKind = kind; document.body.classList.add("replacing");
  announce(`Tap a die to replace with <b>${SPECIAL[kind].name}</b>`);
  mine.cells.forEach((d, i) => { if (d) tween(260, e => d.mesh.scale.setScalar(1 + .14 * Math.sin(Math.PI * e)), (i % N) * 20); });
  SFX.pick();
}
function finishReplace(cell) { const k = replaceKind; replaceKind = null; document.body.classList.remove("replacing"); buySpecial(k, cell); }
function cancelReplace() { replaceKind = null; document.body.classList.remove("replacing"); }

// --- picker ---
function openPicker() {
  cancelReplace();
  const list = document.getElementById("pkList"); list.innerHTML = "";
  const pres = (S.prestige || 0), cost = specialCost();
  for (const k of SKINDS) {
    const sp = SPECIAL[k], unlocked = pres >= sp.lv, afford = S.points >= cost;
    const row = document.createElement("button"); row.className = "pkRow" + (unlocked ? "" : " locked");
    row.innerHTML = `<i class="pkEmb${sp.rainbow ? " rainbow" : ""}" style="--c:#${hex6(sp.col)}">${sp.sym}</i><span class="pkName">${sp.name}</span>`
      + (unlocked ? `<span class="pkCost${afford ? "" : " poor"}">${fmt(cost)}</span>` : `<span class="pkLock">P${sp.lv}</span>`);
    if (unlocked) row.addEventListener("click", () => buySpecial(k)); else row.disabled = true;
    list.appendChild(row);
  }
  document.getElementById("picker").classList.add("open"); SFX.pick();
}
function closePicker() { document.getElementById("picker").classList.remove("open"); }
document.getElementById("pkClose").addEventListener("click", closePicker);
document.getElementById("picker").addEventListener("click", e => { if (e.target.id === "picker") closePicker(); });

window.T = { mine, theirs, S, player, enterBoard, leaveBoard, buy,
  // powers + shiny
  POWERS, SHINY_FX, buffs, pstate, usePower, addBuff, stats,
  spawnShiny, claimShiny, shiny, mikey, pickShiny,
  // special dice
  buySpecial, openPicker, closePicker, SPECIAL, specialCost,
  // prestige
  doPrestige, prestigeStatus, get N() { return N; }, addRun: v => { S.points += v; S.runPoints += v; } }; // test hook
</script>
